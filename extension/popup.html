<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Outlier Finder</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <span class="brand-mark">✨</span>
        <span class="brand-name">Outlier Finder</span>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="icon-btn" title="Rafraîchir maintenant">↻</button>
        <button id="settingsBtn" class="icon-btn" title="Réglages">⚙</button>
      </div>
    </header>

    <div id="statusBar" class="status-bar">
      <span class="status-dot"></span>
      <span id="statusText">Connexion…</span>
    </div>

    <div id="offlinePanel" class="offline-panel hidden">
      <div class="offline-panel-icon">😴</div>
      <strong>Ton serveur dort encore</strong>
      <p>Démarre-le, cette fenêtre se réveillera toute seule.</p>
    </div>

    <nav id="tabsNav" class="segmented">
      <button class="tab-btn active" data-tab="auto">Outliers</button>
      <button class="tab-btn" data-tab="favorites">⭐ Ma liste</button>
    </nav>

    <div id="autoTab" class="tab-panel">
      <div class="toolbar">
        <select id="nicheSelect">
          <option value="">Toutes les niches</option>
        </select>
        <select id="minScoreSelect">
          <option value="">Seuil par défaut</option>
          <option value="2">x2 et +</option>
          <option value="3">x3 et +</option>
          <option value="5">x5 et +</option>
          <option value="10">x10 et +</option>
        </select>
      </div>

      <div id="list" class="list">
        <p class="empty">Chargement des outliers…</p>
      </div>
    </div>

    <div id="favoritesTab" class="tab-panel hidden">
      <div class="toolbar">
        <select id="favNicheSelect">
          <option value="">Toutes les niches</option>
        </select>
      </div>

      <div id="favList" class="list">
        <p class="empty">Chargement…</p>
      </div>
    </div>

    <footer>
      <a href="#" id="openOptions">+ Ajouter une chaîne ou une niche</a>
      <p class="attribution">
        Données fournies par l'API YouTube Data v3 — non affilié à YouTube/Google.<br />
        Made with ❤️ by <a href="https://www.youtube.com/channel/UCAKDeRYLXUbR87rGDrXOpZg" target="_blank">Loan</a>
      </p>
    </footer>
  </div>

  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
